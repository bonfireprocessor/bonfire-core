<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .title { font: 700 34px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .cluster-title { font: 600 20px Helvetica, Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 21px Helvetica, Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 18px Helvetica, Arial, sans-serif; fill: #334155; }
      .edge-label { font: 17px Helvetica, Arial, sans-serif; fill: #334155; }
      .edge { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .edge-both { fill: none; stroke: #475569; stroke-width: 3; marker-start: url(#arrow-back); marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .box { stroke: #334155; stroke-width: 2.5; rx: 16; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1800" height="1120" fill="#ffffff"/>
  <text x="900" y="58" text-anchor="middle" class="title">Bonfire Debug Module Integration</text>

  <rect x="505" y="95" width="790" height="90" class="box" fill="#dbeafe"/>
  <text x="900" y="132" text-anchor="middle" class="box-title">DMI transport</text>
  <text x="900" y="162" text-anchor="middle" class="box-text">native JTAG, ECP5 JTAGG, or direct simulation</text>

  <rect x="505" y="235" width="790" height="90" class="box" fill="#bfdbfe"/>
  <text x="900" y="272" text-anchor="middle" class="box-title">DebugModuleInterface + DebugModuleRegisterBundle</text>
  <text x="900" y="302" text-anchor="middle" class="box-text">DMI register protocol and persistent debug state</text>

  <path d="M 900 185 L 900 235" class="edge-both"/>
  <text x="920" y="217" class="edge-label">DMI request / response</text>

  <rect x="170" y="375" width="1460" height="370" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="200" y="410" class="cluster-title">Debug control and pipeline boundary (system clock domain)</text>

  <rect x="235" y="455" width="480" height="95" class="box" fill="#ede9fe"/>
  <text x="475" y="512" text-anchor="middle" class="box-title">AbstractCommandController</text>

  <rect x="1085" y="455" width="480" height="95" class="box" fill="#ede9fe"/>
  <text x="1325" y="512" text-anchor="middle" class="box-title">HartDebugController</text>

  <rect x="660" y="615" width="480" height="105" class="box" fill="#ddd6fe"/>
  <text x="900" y="660" text-anchor="middle" class="box-title">DebugPipelineAdapter</text>
  <text x="900" y="692" text-anchor="middle" class="box-text">source selection + architectural events</text>

  <path d="M 700 325 L 475 455" class="edge-both"/>
  <text x="420" y="365" class="edge-label">command fields / state</text>
  <path d="M 1100 325 L 1325 455" class="edge-both"/>
  <text x="1165" y="365" class="edge-label">halt, resume, DPC/DCSR</text>

  <path d="M 595 550 L 760 615" class="edge"/>
  <text x="535" y="590" class="edge-label">ProgbufIssue</text>
  <path d="M 660 680 L 565 680 L 565 550" class="edge"/>
  <text x="300" y="672" class="edge-label">ProgbufCompletion</text>

  <path d="M 1205 550 L 1040 615" class="edge"/>
  <text x="1105" y="590" class="edge-label">DebugPipelineRequest</text>
  <path d="M 1140 680 L 1235 680 L 1235 550" class="edge"/>
  <text x="1260" y="672" class="edge-label">DebugPipelineEvent</text>

  <rect x="70" y="875" width="280" height="95" class="box" fill="#dcfce7"/>
  <text x="210" y="915" text-anchor="middle" class="box-title">Fetch</text>
  <text x="210" y="945" text-anchor="middle" class="box-text">normal source</text>

  <rect x="495" y="875" width="280" height="95" class="box" fill="#bbf7d0"/>
  <text x="635" y="930" text-anchor="middle" class="box-title">Decode</text>

  <rect x="970" y="875" width="280" height="95" class="box" fill="#bbf7d0"/>
  <text x="1110" y="930" text-anchor="middle" class="box-title">Execute</text>

  <rect x="1450" y="875" width="280" height="95" class="box" fill="#bbf7d0"/>
  <text x="1590" y="915" text-anchor="middle" class="box-title">Writeback</text>
  <text x="1590" y="945" text-anchor="middle" class="box-text">4-stage only</text>

  <path d="M 210 875 L 210 800 L 660 680" class="edge"/>
  <text x="250" y="815" class="edge-label">fetched instruction</text>
  <path d="M 660 705 L 320 875" class="edge"/>
  <text x="335" y="750" class="edge-label">stall / resume redirect</text>
  <path d="M 900 720 L 900 805 L 635 805 L 635 875" class="edge"/>
  <text x="665" y="790" class="edge-label">selected instruction</text>

  <path d="M 775 922 L 970 922" class="edge"/>
  <text x="872" y="905" text-anchor="middle" class="edge-label">normal path</text>
  <path d="M 1250 922 L 1450 922" class="edge"/>
  <text x="1350" y="905" text-anchor="middle" class="edge-label">normal path</text>

  <path d="M 400 550 L 400 825 L 590 900" class="edge-both"/>
  <text x="250" y="855" class="edge-label">AbstractRegisterTransfer</text>

  <path d="M 1110 875 L 1110 790 L 1030 720" class="edge"/>
  <text x="1130" y="817" class="edge-label">redirect + qualified EBREAK</text>
  <path d="M 1590 875 L 1590 800 L 1140 685" class="edge-dashed"/>
  <text x="1390" y="785" text-anchor="middle" class="edge-label">pipeline-empty contribution</text>

  <text x="900" y="1060" text-anchor="middle" class="box-text">With debug disabled, Fetch connects directly to Decode and the debug controllers, bundles, and adapter are not instantiated.</text>
</svg>
